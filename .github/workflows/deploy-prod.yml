name: Deploy Prod

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

# Releases share one Compose project and nginx site. Queue every cutover.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: scope
        name: Check whether the completed commit needs an image deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base_sha=""
          runs_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs?branch=main&status=completed&per_page=100")" || true
          if [ -n "${runs_json}" ]; then
            while IFS=$'\t' read -r run_id run_sha; do
              jobs_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")" || continue
              if jq -e '.jobs[] | select(.name == "deploy" and .conclusion == "success")' \
                >/dev/null <<<"${jobs_json}"; then
                base_sha="${run_sha}"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"${runs_json}")
          fi
          if [ -z "${base_sha}" ]; then
            # Never silently skip a deploy when GitHub cannot prove a previous
            # successful deploy baseline (including the first production run).
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `-z` and quotepath=false keep non-ASCII paths verbatim: plain
          # `--name-only` escapes them into octal and quotes them, which made
          # every commit adding a Russian-named PRD look like a code commit
          # (stage 254.3).
          should_deploy="$(git -c core.quotepath=false diff --name-only -z \
            "${base_sha}" "${HEAD_SHA}" | ./scripts/deploy_scope_check.sh)"
          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate required secrets
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
        run: |
          if [ -z "${PROD_SSH_TARGET}" ]; then
            echo "Missing required secret: PROD_SSH_TARGET"
            exit 1
          fi
          if [ -z "${PROD_SSH_PRIVATE_KEY}" ]; then
            echo "Missing required secret: PROD_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${FEEDBACK_FINGERPRINT_PEPPER}" ]; then
            echo "Missing required secret: FEEDBACK_FINGERPRINT_PEPPER"
            exit 1
          fi

      - name: Configure SSH
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          HOST="${PROD_SSH_TARGET#*@}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${HOST}" >> ~/.ssh/known_hosts; then
              break
            fi
            if [ -s ~/.ssh/known_hosts ]; then
              echo "ssh-keyscan returned non-zero after writing host keys; continuing."
              break
            fi
            echo "ssh-keyscan attempt ${attempt} failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan did not return host keys; falling back to SSH StrictHostKeyChecking=accept-new."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Stage immutable release
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.1
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          python3 -m scripts.stage385_release stage . "${PROD_SSH_TARGET}" "${REMOTE_DIR}" "${GIT_SHA}"

      - name: Run staged maintenance cutover
        timeout-minutes: 25
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          printf '%s' "${FEEDBACK_FINGERPRINT_PEPPER}" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "${PROD_SSH_TARGET}" \
              "cd '${REMOTE_DIR}/releases/${GIT_SHA}' && python3 -m scripts.stage385_deploy '${REMOTE_DIR}/releases/${GIT_SHA}' '${REMOTE_DIR}' '${GIT_SHA}'"

      - name: Verify public MCP read-only tool
        env:
          PROD_SMOKE_BEARER_TOKEN: ${{ secrets.PROD_SMOKE_BEARER_TOKEN }}
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
        run: |
          python -m pip install --disable-pip-version-check httpx
          DEPLOYED_DOMAIN="$(ssh -o BatchMode=yes "${PROD_SSH_TARGET}" \
            "awk '/server_name/ { gsub(/;/, \"\", \$2); print \$2; exit }' /etc/nginx/sites-available/vetmanager-mcp.conf")"
          test -n "${DEPLOYED_DOMAIN}"
          python scripts/post_deploy_mcp_tool_smoke.py "https://${DEPLOYED_DOMAIN}"
