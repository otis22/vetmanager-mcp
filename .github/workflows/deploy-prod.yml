name: Deploy Prod

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: scope
        name: Check whether the completed commit needs an image deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base_sha=""
          runs_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs?branch=main&status=completed&per_page=100")" || true
          if [ -n "${runs_json}" ]; then
            while IFS=$'\t' read -r run_id run_sha; do
              jobs_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")" || continue
              if jq -e '.jobs[] | select(.name == "deploy" and .conclusion == "success")' \
                >/dev/null <<<"${jobs_json}"; then
                base_sha="${run_sha}"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"${runs_json}")
          fi
          if [ -z "${base_sha}" ]; then
            # Never silently skip a deploy when GitHub cannot prove a previous
            # successful deploy baseline (including the first production run).
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$(git diff --name-only "${base_sha}" "${HEAD_SHA}")"
          if [ -z "${changed_paths}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "${changed_paths}" | grep -Eqv '(^PRD/|^docs/|\.md$)'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
        run: |
          if [ -z "${PROD_SSH_TARGET}" ]; then
            echo "Missing required secret: PROD_SSH_TARGET"
            exit 1
          fi
          if [ -z "${PROD_SSH_PRIVATE_KEY}" ]; then
            echo "Missing required secret: PROD_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${FEEDBACK_FINGERPRINT_PEPPER}" ]; then
            echo "Missing required secret: FEEDBACK_FINGERPRINT_PEPPER"
            exit 1
          fi

      - name: Configure SSH
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          HOST="${PROD_SSH_TARGET#*@}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${HOST}" >> ~/.ssh/known_hosts; then
              break
            fi
            if [ -s ~/.ssh/known_hosts ]; then
              echo "ssh-keyscan returned non-zero after writing host keys; continuing."
              break
            fi
            echo "ssh-keyscan attempt ${attempt} failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan did not return host keys; falling back to SSH StrictHostKeyChecking=accept-new."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Sync code to server (rsync)
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
        run: |
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"
          timeout 180 ssh ${SSH_OPTS} "${PROD_SSH_TARGET}" "mkdir -p '${REMOTE_DIR}'"
          timeout 420 rsync -az --delete \
            -e "ssh ${SSH_OPTS}" \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.cursor/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            ./ "${PROD_SSH_TARGET}:${REMOTE_DIR}/"

      - name: Run remote deploy
        timeout-minutes: 10
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
          PROD_SSL_DOMAIN: ${{ secrets.PROD_SSL_DOMAIN }}
          PROD_CERTBOT_EMAIL: ${{ secrets.PROD_CERTBOT_EMAIL }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          SSL_DOMAIN="${PROD_SSL_DOMAIN:-vetmanager-mcp.vromanichev.ru}"
          SKIP_GIT_PULL=1 SSL_DOMAIN="${SSL_DOMAIN}" CERTBOT_EMAIL="${PROD_CERTBOT_EMAIL}" \
          FEEDBACK_FINGERPRINT_PEPPER="${FEEDBACK_FINGERPRINT_PEPPER}" \
          GIT_SHA="${GIT_SHA}" \
          SSH_KEEPALIVE=1 \
            ./scripts/deploy_server.sh "${PROD_SSH_TARGET}" "${REMOTE_DIR}"

      - name: Verify public MCP read-only tool
        env:
          PROD_SMOKE_BEARER_TOKEN: ${{ secrets.PROD_SMOKE_BEARER_TOKEN }}
          PROD_SSL_DOMAIN: ${{ secrets.PROD_SSL_DOMAIN }}
        run: |
          python -m pip install --disable-pip-version-check httpx
          python scripts/post_deploy_mcp_tool_smoke.py "https://${PROD_SSL_DOMAIN:-vetmanager-mcp.vromanichev.ru}"
