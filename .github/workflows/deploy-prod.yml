name: Deploy Prod

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

# Releases share one Compose project and nginx site. Queue every cutover.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.scope.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: scope
        name: Check whether the completed commit needs an image deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Refuse stale Tests replays independently of baseline/API availability.
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$main_sha" ] || [ "$checkout_sha" != "$HEAD_SHA" ]; then
            echo 'Refusing deployment of a stale or mismatched Tests target.' >&2
            exit 1
          fi
          # Stage 492 may merge before its separately authorized night release.
          if [ -f .github/deploy-hold-stage492 ]; then
            echo 'Stage 492 production release hold is active; no automatic deploy.' >&2
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="$(python3 scripts/deploy_baseline.py)" || base_sha=""
          should_deploy=true
          if [ -z "${base_sha}" ]; then
            # Never silently skip a deploy without a proven successful baseline.
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "${base_sha}^{commit}"; then
            if ! git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
              echo 'Refusing deployment across an unproven history rewrite.' >&2
              exit 1
            fi
          fi
          # Both rename paths and raw non-ASCII names must reach the classifier.
          # An error in either side of the pipe explicitly requires deployment.
          if decision="$(git -c core.quotepath=false diff --name-only -z --no-renames \
            "${base_sha}" "${HEAD_SHA}" | ./scripts/deploy_scope_check.sh)"; then
            case "$decision" in
              true|false) should_deploy="$decision" ;;
            esac
          fi
          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate required secrets
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
        run: |
          if [ -z "${PROD_SSH_TARGET}" ]; then
            echo "Missing required secret: PROD_SSH_TARGET"
            exit 1
          fi
          if [ -z "${PROD_SSH_PRIVATE_KEY}" ]; then
            echo "Missing required secret: PROD_SSH_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "${FEEDBACK_FINGERPRINT_PEPPER}" ]; then
            echo "Missing required secret: FEEDBACK_FINGERPRINT_PEPPER"
            exit 1
          fi

      - name: Configure SSH
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          HOST="${PROD_SSH_TARGET#*@}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${HOST}" >> ~/.ssh/known_hosts; then
              break
            fi
            if [ -s ~/.ssh/known_hosts ]; then
              echo "ssh-keyscan returned non-zero after writing host keys; continuing."
              break
            fi
            echo "ssh-keyscan attempt ${attempt} failed; retrying..."
            sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ssh-keyscan did not return host keys; falling back to SSH StrictHostKeyChecking=accept-new."
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Verify production Docker architecture for pinned GHCR base
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
        run: |
          architecture="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${PROD_SSH_TARGET}" "docker info --format '{{.Architecture}}'")"
          echo "Production Docker architecture: ${architecture}"
          if [ "${architecture}" != "x86_64" ] && [ "${architecture}" != "amd64" ]; then
            echo 'Pinned GHCR base supports amd64 only; stop before staging.' >&2
            exit 1
          fi

      - name: Stage immutable release
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.1
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          python3 -m scripts.stage385_release stage . "${PROD_SSH_TARGET}" "${REMOTE_DIR}" "${GIT_SHA}"

      - name: Run staged maintenance cutover
        timeout-minutes: 25
        env:
          PROD_SSH_TARGET: ${{ secrets.PROD_SSH_TARGET }}
          PROD_REMOTE_DIR: ${{ secrets.PROD_REMOTE_DIR }}
          FEEDBACK_FINGERPRINT_PEPPER: ${{ secrets.FEEDBACK_FINGERPRINT_PEPPER }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REMOTE_DIR="${PROD_REMOTE_DIR:-/opt/vetmanager-mcp}"
          printf '%s' "${FEEDBACK_FINGERPRINT_PEPPER}" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "${PROD_SSH_TARGET}" \
              "cd '${REMOTE_DIR}/releases/${GIT_SHA}' && python3 -m scripts.stage385_deploy '${REMOTE_DIR}/releases/${GIT_SHA}' '${REMOTE_DIR}' '${GIT_SHA}'"

      - name: Verify public MCP read-only tool
        id: public_smoke
        # External DNS/TLS can be unavailable from the runner after a healthy
        # internal cutover. Report it without triggering another deployment.
        continue-on-error: true
        env:
          PROD_SMOKE_BEARER_TOKEN: ${{ secrets.PROD_SMOKE_BEARER_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check httpx
          python scripts/post_deploy_mcp_tool_smoke.py

      - name: Alert on public smoke failure
        if: ${{ steps.public_smoke.outcome == 'failure' }}
        run: echo '::warning::Public MCP smoke failed after cutover; check external DNS and TLS.'

      - name: Record deployed commit ${{ github.event.workflow_run.head_sha }}
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
