name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'PRD/**', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'PRD/**', 'docs/**']
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: vetmanager-mcp-test:latest
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha,scope=vetmanager-mcp-test
          cache-to: type=gha,mode=max,scope=vetmanager-mcp-test

      - name: Save image and check runner capacity
        run: |
          docker save -o vetmanager-mcp-test.tar vetmanager-mcp-test
          bytes="$(stat -c %s vetmanager-mcp-test.tar)"
          available="$(df -B1 --output=avail . | tail -1)"
          echo "Image archive: ${bytes} bytes; free disk: ${available} bytes"
          test "${bytes}" -le 4294967296
          test "${available}" -ge 8589934592

      - uses: actions/upload-artifact@v4
        with:
          name: vetmanager-mcp-test-image
          path: vetmanager-mcp-test.tar
          retention-days: 1
          compression-level: 0

  fast:
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: docker load -i vetmanager-mcp-test.tar

      - name: Run fast contour
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            python scripts/run_fast_test_suite.py

      - name: Validate executable structured review gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            pytest -q tests/test_review_result_gate.py

  default:
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate production Compose resources
        run: python3 scripts/check_stage384_compose_config.py

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: docker load -i vetmanager-mcp-test.tar

      - name: Run default contour
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            python scripts/run_default_test_suite.py

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            {
              echo '## Test coverage'
              echo
              echo '```text'
              python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("coverage.xml").getroot(); rate = root.attrib["line-rate"]; print(f"Total line coverage: {float(rate) * 100:.2f}%")'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'coverage.xml was not produced; the default test run failed before coverage reporting.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  postgres-activation-telemetry:
    needs: build-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: vetmanager_test
          POSTGRES_USER: vetmanager
          POSTGRES_PASSWORD: vetmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetmanager -d vetmanager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: docker load -i vetmanager-mcp-test.tar

      - name: Run mandatory PostgreSQL activation telemetry regression
        run: |
          docker run --rm --network host \
            -e POSTGRES_TEST_DATABASE_URL=postgresql+asyncpg://vetmanager:vetmanager@127.0.0.1:5432/vetmanager_test \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            pytest -q tests/test_stage227_postgres_activation_telemetry.py tests/test_stage359_postgres_activation_journal.py tests/test_stage374_first_session.py
