name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope-and-reuse:
    runs-on: ubuntu-latest
    outputs:
      run_product: ${{ steps.force.outputs.force_full == 'true' || steps.scope.outputs.run_product == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate documentation structure on the tested tree
        run: python3 scripts/check_roadmap_structure.py

      - name: Force product checks when the decision surface changes on main
        id: force
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          force_full=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git diff --quiet "$BEFORE_SHA" HEAD -- \
              .github/workflows scripts/ci_scope.py \
              scripts/check_roadmap_structure.py scripts/run_fast_test_suite.py \
              scripts/run_default_test_suite.py scripts/offline_gate_manifest.py; then
              force_full=true
            fi
          fi
          echo "force_full=$force_full" >> "$GITHUB_OUTPUT"

      - name: Decide product scope and exact-tree reuse
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py

  build-image:
    needs: scope-and-reuse
    if: ${{ needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: vetmanager-mcp-test:latest
          build-args: |
            UID=1001
            GID=1001
          cache-from: type=gha,scope=vetmanager-mcp-test
          cache-to: type=gha,mode=max,scope=vetmanager-mcp-test

      - name: Save image and check runner capacity
        run: |
          docker save -o vetmanager-mcp-test.tar vetmanager-mcp-test
          bytes="$(stat -c %s vetmanager-mcp-test.tar)"
          available="$(df -B1 --output=avail . | tail -1)"
          echo "Image archive: ${bytes} bytes; free disk: ${available} bytes"
          test "${bytes}" -le 4294967296
          test "${available}" -ge 8589934592

      - uses: actions/upload-artifact@v4
        with:
          name: vetmanager-mcp-test-image
          path: vetmanager-mcp-test.tar
          retention-days: 1
          compression-level: 0

  fast:
    needs: [scope-and-reuse, build-image]
    if: ${{ needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: |
          docker load -i vetmanager-mcp-test.tar
          rm vetmanager-mcp-test.tar

      - name: Run fast contour
        run: |
          started=$SECONDS
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            python scripts/run_fast_test_suite.py
          elapsed=$(( SECONDS - started ))
          echo "Fast contour wall seconds: $elapsed"
          if (( elapsed > 180 )); then
            echo "Fast contour exceeded 180 seconds" >&2
            exit 1
          fi

      - name: Validate executable structured review gate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            pytest -q tests/test_review_result_gate.py

  inventory-preflight:
    needs: [scope-and-reuse, build-image]
    if: ${{ needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image
      - name: Load test image
        run: |
          docker load -i vetmanager-mcp-test.tar
          rm vetmanager-mcp-test.tar
      - name: Check versioned inventories before expensive suites
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            sh -c 'python scripts/offline_gate_manifest.py default --check-inventory && python scripts/offline_gate_manifest.py postgres --check-inventory'

  default:
    needs: [scope-and-reuse, build-image, inventory-preflight]
    if: ${{ needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate production Compose resources
        run: python3 scripts/check_stage384_compose_config.py

      - name: Validate stage 190 Compose configuration
        run: python3 scripts/check_stage190_compose.py

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: |
          docker load -i vetmanager-mcp-test.tar
          rm vetmanager-mcp-test.tar

      - name: Run default contour
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            python scripts/run_default_test_suite.py

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            {
              echo '## Test coverage'
              echo
              echo '```text'
              python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("coverage.xml").getroot(); rate = root.attrib["line-rate"]; print(f"Total line coverage: {float(rate) * 100:.2f}%")'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'coverage.xml was not produced; the default test run failed before coverage reporting.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  postgres-activation-telemetry:
    needs: [scope-and-reuse, build-image, inventory-preflight]
    if: ${{ needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vetmanager_test
          POSTGRES_USER: vetmanager
          POSTGRES_PASSWORD: vetmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetmanager -d vetmanager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: vetmanager-mcp-test-image

      - name: Load test image
        run: |
          docker load -i vetmanager-mcp-test.tar
          rm vetmanager-mcp-test.tar

      - name: Create isolated stage 408 database
        run: |
          docker run --rm --network host -e PGPASSWORD=vetmanager postgres:16-alpine \
            psql -h 127.0.0.1 -U vetmanager -d vetmanager_test \
            -c 'CREATE DATABASE vetmanager_stage408'

      - name: Run mandatory PostgreSQL regression contour
        run: |
          docker run --rm --network host \
            -e POSTGRES_TEST_DATABASE_URL=postgresql+asyncpg://vetmanager:vetmanager@127.0.0.1:5432/vetmanager_test \
            -e STAGE408_PG_URL=postgresql+asyncpg://vetmanager:vetmanager@127.0.0.1:5432/vetmanager_stage408 \
            -v "${{ github.workspace }}:/app" \
            -u 1001:1001 \
            vetmanager-mcp-test \
            sh -c 'python scripts/offline_gate_manifest.py postgres --write-fingerprint /tmp/stage465-pg.start && python -W error -m pytest -q -m postgres --junitxml=/tmp/stage424-postgres.xml && python scripts/check_stage424_postgres_results.py /tmp/stage424-postgres.xml && python scripts/offline_gate_manifest.py postgres --junit /tmp/stage424-postgres.xml --output /app/.stage465-postgres-gate.json --starting-fingerprint-file /tmp/stage465-pg.start'

  validated-tree:
    needs: [scope-and-reuse, build-image, inventory-preflight, fast, default, postgres-activation-telemetry]
    if: ${{ github.event_name == 'pull_request' && needs.scope-and-reuse.outputs.run_product == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Record tested merge tree
        id: marker
        run: |
          git rev-parse HEAD > tested-commit.txt
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-tree-${{ steps.marker.outputs.tree }}
          path: tested-commit.txt
          retention-days: 30
