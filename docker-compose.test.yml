# A dedicated project, no production services, no published ports or durable data.
services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetmanager_test
      POSTGRES_USER: vetmanager
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?generated by run_isolated_test_suite.py}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, vetmanager, -d, vetmanager_test]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    extends:
      file: docker-compose.yml
      service: test
    environment:
      DATABASE_URL: sqlite:////tmp/isolated-tests.db
      LOG_LEVEL: WARNING
      STORAGE_ENCRYPTION_KEY: ${TEST_STORAGE_ENCRYPTION_KEY:?generated by runner}
      WEB_SESSION_SECRET: ${TEST_WEB_SESSION_SECRET:?generated by runner}
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://vetmanager:${TEST_POSTGRES_PASSWORD}@pg:5432/vetmanager_test
      STAGE385_REDIS_URL: redis://redis:6379/0
      STAGE385_PG_URL: postgresql+asyncpg://vetmanager:${TEST_POSTGRES_PASSWORD}@pg:5432/stage385
      STAGE385_PG_HOOK_DIR: /evidence/pg-hook
      STAGE400_PG_URL: postgresql+asyncpg://vetmanager:${TEST_POSTGRES_PASSWORD}@pg:5432/stage400
      STAGE408_PG_URL: postgresql+asyncpg://vetmanager:${TEST_POSTGRES_PASSWORD}@pg:5432/stage408
      RUN_REAL_WEB_TESTS: "1"
      RUN_REAL_BROWSER_TESTS: "1"
      VM_HTTP_CLIENT_CLOSE_GRACE_SECONDS: "0.5"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg-data:
